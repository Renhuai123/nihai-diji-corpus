<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">金城局</title>
  <desc id="desc">山川围成近圆形，圈内下方的小圈表示祖坟，圈上短线表示朝向。两条线在圆的上缘相互穿过，各自伸向圆外，交点用朱红点出。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#292929">
    <rect x="46" y="36" width="140" height="48" rx="3" fill="none" stroke="#484848" stroke-width="1.5"/>
    <text x="116" y="68" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="2">金城局</text>

    <path d="M332 207
             C370 173 417 179 460 150
             C503 179 552 173 588 207
             C622 239 639 284 632 333
             C622 418 551 478 460 478
             C367 478 295 421 281 340
             C272 288 290 245 332 207 Z"
          fill="#f6f6f4"/>

    <g fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M332 207
               C290 245 272 288 281 340
               C295 421 367 478 460 478
               C551 478 622 418 632 333
               C639 284 622 239 588 207"/>
      <path d="M588 207
               C552 173 503 179 460 150
               C417 121 362 105 297 99"/>
      <path d="M332 207
               C370 173 417 179 460 150
               C503 121 531 91 568 74"/>
      <path d="M459 383 Q456 361 457 337" stroke-width="2.4"/>
      <circle cx="460" cy="395" r="12" fill="#fff" stroke-width="2.4"/>
    </g>

    <g fill="none" stroke="#ad4033" stroke-width="3.8" stroke-linecap="round">
      <path d="M449.5 143.25 Q455 146.63 460 150 Q465 153.37 470.5 156.45"/>
      <path d="M449.5 156.45 Q455 153.37 460 150 Q465 146.63 470.5 142.72"/>
    </g>

    <g fill="none" stroke="#858585" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M210 290 H248 L279 302"/>
      <path d="M608 230 L651 209 H684"/>
      <path d="M477 150 H650"/>
      <path d="M466 346 H495"/>
      <path d="M443 397 H395"/>
    </g>

    <g font-size="20">
      <text x="198" y="297" text-anchor="end">山川</text>
      <text x="697" y="216">有水来</text>
      <text x="580" y="78">从这边出去</text>
      <text x="506" y="353">朝向</text>
      <text x="384" y="404" text-anchor="end">祖坟</text>
    </g>

    <text x="666" y="146" font-size="24" font-weight="600">交加在一起</text>
    <text x="667" y="176" font-size="20">朱雀不好</text>
  </g>
</svg>
