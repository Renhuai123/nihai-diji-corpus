<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">白虎：尾尖口阔</title>
  <desc id="desc">左侧俯视图画来龙向下结穴，两侧山脊先向下弯，再各自向外反折，尖尾之间留下宽口。右侧并列口述中的「几、儿、鼠」三个字，下方以宽嘴、尖下巴画出倪师所作的形状类比。</desc>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#262626">
    <rect x="46" y="34" width="102" height="47" rx="3" fill="none" stroke="#444" stroke-width="1.5"/>
    <text x="97" y="66" text-anchor="middle" font-size="25" font-weight="600">白虎</text>
    <text x="169" y="66" font-size="24">尾尖口阔</text>

    <path d="M631 108 V479" fill="none" stroke="#d7d7d4" stroke-width="1"/>

    <!-- 来龙的脊线从上往下，两侧山脊由同一山体分出。 -->
    <path d="M279 109
             C282 143 305 164 301 195
             C298 213 286 221 264 230
             C223 246 204 270 196 301
             C188 336 162 362 79 381
             C145 382 185 366 207 340
             C224 320 227 296 246 279
             C263 264 285 259 307 262
             Q321 265 334 286
             Q341 266 355 263
             C380 258 404 270 420 292
             C435 313 435 333 454 351
             C482 377 522 384 590 380
             C521 367 490 344 479 311
             C466 271 449 247 406 230
             C372 217 354 207 349 185
             C342 160 343 133 324 107"
          fill="#f1f1ef" stroke="#363636" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="none" stroke="#a1a19c" stroke-width="1.4" stroke-linecap="round">
      <path d="M301 113 C307 143 326 168 325 198 C324 221 329 238 333 252"/>
      <path d="M309 231 C261 238 228 263 214 303 C204 333 185 353 156 365"/>
      <path d="M350 231 C399 238 435 264 451 306 C461 334 479 353 509 365"/>
    </g>

    <g fill="none" stroke="#848480" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M214 148 H259 L303 164"/>
      <path d="M340 271 L359 287 H374"/>
      <path d="M535 272 H511 L480 312"/>
      <path d="M68 337 V354 L80 376"/>
    </g>
    <text x="204" y="154" text-anchor="end" font-size="20">来龙</text>
    <circle cx="333" cy="264" r="5.5" fill="#b43b30" stroke="#fff" stroke-width="1.5"/>
    <text x="381" y="294" font-size="20">穴</text>
    <text x="543" y="279" font-size="20">反背</text>
    <text x="49" y="328" font-size="20">尾尖</text>

    <!-- 横跨两尖端的尺寸线直接标出开口。 -->
    <g fill="none" stroke="#92928d" stroke-width="1.2">
      <path d="M80 396 V411 M80 404 H300 M371 404 H590 M590 396 V411"/>
    </g>
    <text x="335" y="411" text-anchor="middle" font-size="22">口阔</text>
    <text x="335" y="475" text-anchor="middle" font-size="23">不会藏风纳气</text>

    <!-- 字例保留原字；面相只取口与下颌两处轮廓。 -->
    <g text-anchor="middle" font-size="53">
      <text x="698" y="191">几</text>
      <text x="787" y="191">儿</text>
      <text x="876" y="191">鼠</text>
    </g>
    <path d="M663 238 H913" fill="none" stroke="#d7d7d4" stroke-width="1"/>

    <g fill="none" stroke="#383838" stroke-linecap="round" stroke-linejoin="round">
      <path d="M675 298
               C676 321 683 344 698 367
               C710 385 727 403 745 423
               Q747 426 750 423
               C768 403 784 386 797 366
               C811 344 818 320 819 298"
            stroke-width="2.3"/>
      <path d="M694 333
               Q716 328 735 326 Q741 326 747 329
               Q753 326 760 326 Q782 328 800 333
               Q775 348 747 348 Q719 348 694 333 Z"
            fill="#f1f1ef" stroke-width="1.8"/>
      <path d="M695 333 Q746 339 799 333" stroke-width="1.3"/>
    </g>
    <g fill="none" stroke="#848480" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M801 333 L824 318 H837"/>
      <path d="M754 424 L780 436 H812"/>
    </g>
    <text x="843" y="324" font-size="18">嘴巴很大</text>
    <text x="819" y="442" font-size="18">下巴那么尖</text>
  </g>
</svg>
