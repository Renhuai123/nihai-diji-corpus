    <path d="M359 133
             C328 178 319 236 331 299
             C343 368 377 430 431 475
             C369 439 322 373 305 302
             C288 232 307 167 359 133Z"
          fill="#f2f2f0" stroke="#444" stroke-width="2.4"/>

    <path d="M359 133
             C327 184 325 255 350 309
             C369 350 405 373 437 364
             C466 356 471 320 461 287
             C454 263 430 250 424 229
             C418 209 425 192 439 190
             C455 187 464 201 466 222
             C469 254 482 294 505 313
             C520 326 541 324 552 312
             C569 293 543 277 547 255
             C551 233 578 235 579 212
             C580 188 555 182 538 172
             C519 160 529 143 554 130
             C533 114 505 111 484 107
             C459 103 451 96 456 80
             C461 62 481 52 496 58
             C510 64 508 78 524 88
             C540 98 568 97 578 112
             C588 128 585 149 573 156
             C561 164 568 172 583 181
             C604 193 608 211 598 233
             C592 248 578 250 576 264
             C573 282 593 295 605 314
             C615 328 618 343 613 356"
