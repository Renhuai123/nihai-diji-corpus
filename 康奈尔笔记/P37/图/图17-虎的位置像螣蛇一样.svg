    <path d="M562 146 L611 117" fill="none" stroke="#555" stroke-width="2.1"/>

    <g fill="none" stroke="#929292" stroke-width="1.3">
      <path d="M233 216 H273 L300 232"/>
      <path d="M254 453 H363 L421 469"/>
      <path d="M576 161 L637 151 H683"/>
    </g>
    <circle cx="572" cy="160" r="4.5" fill="#ad4033" stroke="#fff" stroke-width="1.3"/>
  </g>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#272727">
    <g text-anchor="end">
      <text x="220" y="210" font-size="25" font-weight="600">龙</text>
      <text x="220" y="239" font-size="20">这边很好</text>
      <text x="241" y="460" font-size="21">结穴也很好</text>
    </g>
    <text x="698" y="149" font-size="25" font-weight="600">虎的位置</text>
