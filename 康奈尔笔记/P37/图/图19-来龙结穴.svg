  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#272725">
    <text x="243" y="138" text-anchor="middle" font-size="18">尾巴勾个翘进来</text>
    <text x="290" y="342" text-anchor="middle" font-size="18">白虎</text>
    <text x="176" y="484" text-anchor="middle" font-size="20">突了多一点出去</text>
    <text x="705" y="76" font-size="21">来龙</text>
    <text x="863" y="171" text-anchor="middle" font-size="18">很多脚叉出去</text>
    <text x="640" y="319" text-anchor="middle" font-size="25" font-weight="600" fill="#a54135">富贵的大穴</text>
  </g>
</svg>
