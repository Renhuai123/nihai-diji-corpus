<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">玄武形与案山</title>
  <desc id="desc">左上画来龙下行，山势向两侧伸出又折回，形成尖角和可藏身的死角。右侧以同一组山形对照蹲、站时的视线，左下依课中说法，从结穴处看小山头落在左、中、右哪一组房。</desc>

