        <path d="M-26 -5 C-36 -2 -36 13 -26 16 C-21 18 -16 15 -12 15 Q0 25 12 15 C16 15 21 18 26 16 C36 13 36 -2 26 -5"/>
      </g>
      <path d="M-33 117 C-23 114 -13 109 -7 110 Q0 113 7 110 C13 109 23 114 33 117 C22 126 -22 126 -33 117Z"
