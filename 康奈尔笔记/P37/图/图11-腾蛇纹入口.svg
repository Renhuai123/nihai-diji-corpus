    <use href="#face"/>
    <g fill="none" stroke-width="3.3" stroke-linecap="round">
      <g stroke="#343432">
        <use href="#fold"/>
        <use href="#fold" transform="scale(-1 1)"/>
      </g>
      <path d="M-78 89 C-81 108 -63 123 -48 121 Q-40 120 -33 117 M78 89 C81 108 63 123 48 121 Q40 120 33 117"
            stroke="#ac4035"/>
