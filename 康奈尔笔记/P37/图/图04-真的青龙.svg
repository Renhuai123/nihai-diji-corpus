<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">真的青龙</title>
  <desc id="desc">左图画来龙从上方进入，结穴在大弧顶部内侧，官鬼从右下方有力地伸出。右图并列板书的「孤」字，末捺同样向右下舒展，倪师称这一捺为青龙。</desc>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#252525">
    <g fill="none" stroke="#555" stroke-width="1.4">
      <rect x="48" y="38" width="108" height="46" rx="3"/>
      <rect x="563" y="38" width="108" height="46" rx="3"/>
    </g>
    <g font-size="23" font-weight="600" text-anchor="middle">
      <text x="102" y="69">堪舆</text>
      <text x="617" y="69">测字</text>
    </g>

    <!-- 大弧底部留口，右下伸出的部分接在弧上。 -->
    <g fill="#f1f1ef" stroke="#393939" stroke-width="2.3" stroke-linejoin="round">
      <path d="M168 364
               C132 346 111 308 111 264
               C111 201 158 155 220 152
               C278 148 327 186 337 239
               C343 273 333 303 314 324
               C304 335 293 344 280 350
               C305 325 322 292 321 259
               C319 204 274 165 222 167
               C167 169 126 211 126 264
               C126 302 141 337 168 364 Z"/>
      <path d="M327 299
               C345 316 353 336 374 354
               C400 377 432 397 476 413
               C430 407 392 391 362 369
               C341 354 326 333 315 320"/>
    </g>

    <!-- 来脉在弧顶收窄，内侧的竖笔合成水滴形。 -->
    <path d="M251 99
             C245 120 230 138 226 157
             C225 177 240 196 238 215
             C237 229 230 239 222 240
             C212 238 208 228 209 214
             C211 194 217 175 216 158
             C218 137 236 115 251 99 Z"
          fill="#e2e2df" stroke="#393939" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M222 171 C221 190 218 206 222 226"
          fill="none" stroke="#858581" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="222" cy="230" r="5.8" fill="#ad4034" stroke="#fff" stroke-width="1.5"/>

    <g fill="none" stroke="#777" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M263 113 L280 102 H303"/>
      <path d="M230 231 H261"/>
      <path d="M397 391 L382 423 H355"/>
    </g>
    <g font-size="21">
      <text x="312" y="109">来龙</text>
      <text x="270" y="238">结穴</text>
      <text x="345" y="431" text-anchor="end">官鬼出去</text>
    </g>
    <text x="345" y="459" text-anchor="end" font-size="17" fill="#555">力量很强</text>

    <!-- 依板书分笔写「孤」，使末捺能单独向右下舒展。 -->
    <g aria-label="孤" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M579 222 Q604 217 634 206 Q623 230 605 251"/>
      <path d="M604 249 C622 263 624 293 619 322 Q616 342 600 350 L590 336"/>
      <path d="M570 295 Q605 285 645 264"/>

      <path d="M750 173 Q721 192 669 204"/>
      <path d="M671 205 C673 254 664 313 636 346"/>
      <path d="M699 202 C701 243 701 290 692 325 Q706 320 725 308"/>
      <path d="M717 293 Q730 304 736 319"/>
    </g>
    <path d="M728 201
             C740 237 761 275 789 302
             C809 322 832 336 866 348
             C842 346 819 339 798 325
             C766 303 743 261 727 214
             Q724 201 728 201 Z"
          fill="#333"/>
    <path d="M815 341 L804 380 H770"
          fill="none" stroke="#777" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="759" y="388" text-anchor="end" font-size="21">这一捺出去</text>
    <text x="815" y="411" font-size="22" font-weight="600">青龙</text>
  </g>
</svg>
