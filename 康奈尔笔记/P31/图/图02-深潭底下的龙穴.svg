<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">深潭底下的龙穴</title>
  <desc id="desc">侧视剖面。灰色曲线示意紫气围绕山脉，箭头顺着山势指向深潭，朱红点标出山脉在潭底结束、结穴的位置。倪师讲述的故事里，此处在上古曾喷出过岩浆。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#282828">
    <rect x="48" y="35" width="248" height="48" rx="3" fill="none" stroke="#555" stroke-width="1.4"/>
    <text x="172" y="67" text-anchor="middle" font-size="24" font-weight="600">沿着那个龙脉找</text>

    <!-- 山坡入水后继续下行，在潭底收尽。 -->
    <path d="M48 270
             C86 261 112 223 142 206
             C164 193 171 201 188 184
             C211 162 229 133 249 140
             C268 147 282 174 304 182
             C322 189 332 174 346 183
             C369 197 386 225 411 231
             C427 235 437 227 452 236
             C487 258 505 277 535 286
