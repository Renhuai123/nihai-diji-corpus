<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">南龙与台北立向</title>
  <desc id="desc">左图画倪师所说的南龙自东西向入海，在台湾转为南北向。右图用淡水海口的落日辨西，对照台北龙穴口朝西与总统府坐西向东。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 10 6 2 10.5" fill="none" stroke="#353535" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#282828">
    <path d="M459 41 V498" fill="none" stroke="#dededb" stroke-width="1.2"/>

    <g fill="none" stroke="#454545" stroke-width="1.5">
      <rect x="42" y="36" width="98" height="45" rx="3"/>
      <rect x="493" y="36" width="121" height="45" rx="3"/>
    </g>
    <g text-anchor="middle" font-size="24" font-weight="600">
      <text x="91" y="67">台湾</text>
      <text x="553.5" y="67">台北市</text>
    </g>

    <path d="M317 112
             C329 115 348 120 355 134
             C361 146 355 157 346 164
             C338 171 339 190 337 214
             C334 256 322 301 306 344
             C296 371 286 396 283 414
             Q281 426 276 418
             C274 408 275 398 266 387
             C248 366 237 342 233 310
             C228 277 234 244 244 212
             C254 180 274 143 295 124
             Q309 112 317 112Z"
          fill="#f4f4f2" stroke="#51514f" stroke-width="2.2" stroke-linejoin="round"/>

    <path d="M313 148 C311 179 303 214 294 251 C286 289 278 334 278 385"
          fill="none" stroke="#d1d1cd" stroke-width="12" stroke-linecap="round"/>
    <path d="M313 148 C311 179 303 214 294 251 C286 289 278 334 278 385"
          fill="none" stroke="#60605d" stroke-width="2" stroke-linecap="round"/>

    <path d="M48 238 H176" fill="none" stroke="#353535" stroke-width="2.4" marker-end="url(#arrow)"/>
    <path d="M182 238 H253 C281 238 290 242 291 263"
          fill="none" stroke="#777774" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
    <text x="48" y="216" font-size="21">南龙是东西过来</text>
    <text x="202" y="272" font-size="18" text-anchor="middle">入海</text>

    <path d="M287 316 L316 330 H332" fill="none" stroke="#888884" stroke-width="1.2"/>
    <text x="342" y="337" font-size="21">南北向</text>

    <g font-size="20">
      <text x="48" y="480">正在走南龙的气运</text>
      <path d="M225 473 H261" fill="none" stroke="#353535" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="281" y="480">比较旺</text>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M830 277 C810 255 805 232 776 218 C749 205 723 211 698 201 C672 190 651 177 623 177"
            stroke="#d9d9d5" stroke-width="10"/>
      <path d="M901 162 C873 161 861 177 846 191 C827 210 803 215 771 216"
            stroke="#d9d9d5" stroke-width="7"/>
      <path d="M830 277 C810 255 805 232 776 218 C749 205 723 211 698 201 C672 190 651 177 623 177"
            stroke="#777774" stroke-width="1.6"/>
      <path d="M901 162 C873 161 861 177 846 191 C827 210 803 215 771 216"
            stroke="#777774" stroke-width="1.4"/>
    </g>

    <g fill="none" stroke="#62625e" stroke-linecap="round">
      <path d="M518 177 A18 18 0 0 1 554 177" stroke-width="2.1"/>
      <path d="M502 177 H571 M521 185 H551" stroke-width="1.5"/>
    </g>
    <g font-size="18">
      <text x="536" y="216" text-anchor="middle">夕阳西下</text>
      <text x="626" y="158" text-anchor="middle">海口</text>
      <text x="849" y="143">基隆河</text>
      <text x="837" y="262">淡水河</text>
    </g>

    <g fill="none" stroke="#353535" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M744 312 Q780 318 782 332 Q779 346 744 352"/>
      <path d="M763 332 H562" marker-end="url(#arrow)"/>
      <rect x="737" y="418" width="26" height="26" rx="1" fill="#f4f4f2"/>
      <path d="M764 431 H895" marker-end="url(#arrow)"/>
    </g>
    <g font-size="21">
      <text x="650" y="319" text-anchor="middle">朝西</text>
      <text x="800" y="339">龙穴口</text>
      <text x="718" y="439" text-anchor="end">总统府</text>
      <text x="833" y="413" text-anchor="middle">坐西向东</text>
    </g>
  </g>
</svg>
