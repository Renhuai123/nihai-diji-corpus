<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">中国的地形与北龙</title>
  <desc id="desc">俯视图把葱岭、喜马拉雅山、黄河、中原和长江分别标在相应位置，呈现倪师所讲的地形与人体比喻。北缘几道山脉向下直行，右侧放大山脊的棱线，底部标出讲中黄河改道与中龙被切断的关系。</desc>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424">
    <text x="46" y="56" font-size="28" font-weight="600">中国的地形</text>

    <!-- 版图按板书取形，东缘留出突角与离岸的弯形。 -->
    <g fill="#f6f6f4" stroke="#858581" stroke-width="1.7" stroke-linejoin="round">
      <path d="M86 230
               C111 217 134 191 156 163
               Q182 129 208 123
               Q235 117 258 122 Q278 127 303 117
               Q328 108 350 116 Q377 124 405 117
               Q434 108 459 115 Q482 122 510 113
               Q534 105 557 110 Q576 114 593 99
               Q606 87 618 101 Q632 117 637 140
               Q643 162 639 180 Q637 198 651 209
               Q666 221 667 237 Q666 248 657 244
               Q646 238 638 225 Q631 215 626 227
               Q616 248 626 264 Q637 281 628 299
               Q619 320 606 335 Q598 349 583 360
               Q568 371 557 387 Q542 405 523 403
               Q502 399 484 410 Q461 422 440 417
               Q415 409 393 421 Q368 436 345 432
               Q316 430 292 413 Q264 395 241 390
               Q204 380 176 363 Q151 347 129 340
               Q100 332 82 316 Q62 297 66 272
               Q68 246 86 230Z"/>
      <path d="M691 205 Q700 199 708 184 Q711 179 714 180
               Q714 192 705 203 Q694 217 679 221
               Q681 215 691 205Z"/>
      <path d="M645 335 Q649 326 654 322 Q657 326 653 337
               Q649 347 643 351 Q641 346 645 335Z"/>
    </g>

    <!-- 脑与脊椎的比喻，分别落在西端与其延伸的长弧上。 -->
    <path d="M82 251 Q93 234 110 235 Q128 237 134 252
             Q141 270 130 283 Q117 297 99 293 Q82 290 77 275 Q73 262 82 251Z"
          fill="#e2e2df" stroke="#6a6a66" stroke-width="1.6"/>
    <path d="M122 248 C170 252 216 244 257 227 C302 210 329 186 352 157"
          fill="none" stroke="#aaa9a4" stroke-width="4.2" stroke-linecap="round"/>

    <g fill="none" stroke="#898985" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M92 233 L72 202 H44"/>
      <path d="M238 231 L226 207"/>
    </g>
    <text x="44" y="169" font-size="21" font-weight="600">葱岭</text>
    <text x="44" y="192" font-size="17" fill="#555">大脑</text>
    <text x="183" y="173" font-size="21" font-weight="600">喜马拉雅山</text>
    <text x="183" y="197" font-size="17" fill="#555">脊椎骨　督脉</text>

    <!-- 北缘几道分开的山脊向下直行。 -->
    <g fill="none" stroke="#353535" stroke-width="2.9" stroke-linecap="round">
      <path d="M389 106 C392 120 382 141 383 169"/>
      <path d="M425 104 C429 121 419 145 420 178"/>
      <path d="M462 106 C467 125 456 145 457 172"/>
      <path d="M498 104 C502 120 493 140 493 161"/>
    </g>
    <text x="440" y="83" text-anchor="middle" font-size="23" font-weight="600">北龙</text>

    <!-- 一条河中途折出窄高弯，另一条在下方平缓东行。 -->
    <g fill="none" stroke="#383838" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M171 311 C201 312 221 294 245 286
               C268 277 287 281 301 272
               C314 263 311 225 323 215
               Q333 208 342 218 C351 228 335 252 344 261
               C353 270 373 250 395 249
               C427 247 449 263 479 257
               C508 251 524 234 548 240
               C572 246 588 268 625 261"/>
      <path d="M170 336 C203 329 226 342 253 347
               C284 353 309 343 339 347
               C373 353 395 360 425 354
               C459 347 482 340 512 345
               C545 351 573 344 605 336"/>
    </g>

    <text x="426" y="230" font-size="21" font-weight="600">黄河</text>
    <text x="480" y="230" font-size="17" fill="#555">大肠排粪</text>

    <text x="378" y="310" font-size="21" font-weight="600">中原</text>
    <text x="433" y="310" font-size="17" fill="#555">肠胃吸收能量</text>

    <text x="432" y="386" font-size="21" font-weight="600">长江</text>
    <text x="487" y="386" font-size="17" fill="#555">小便</text>

    <!-- 引出一条北方山脊，展开棱线和两侧逐层落下的山势。 -->
    <path d="M499 136 H581 L629 78 H749"
          fill="none" stroke="#aaa" stroke-width="1.1" stroke-dasharray="4 5" stroke-linecap="round"/>
    <text x="769" y="85" font-size="19" font-weight="600">山脉的走势</text>

    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M731 267 Q754 249 766 229 Q781 211 798 209
               Q811 195 827 187 Q840 175 854 172
               Q867 155 879 152 Q895 132 914 122
               Q912 144 905 159 Q916 167 927 170
               Q912 178 897 177 Q891 191 876 197
               Q875 212 862 218 Q849 227 834 227
               Q821 244 804 246 Q787 246 776 254
               Q754 268 731 267Z" fill="#efefec" stroke="none"/>
      <g fill="none" stroke="#888883" stroke-width="1.7">
        <path d="M774 241 Q793 232 806 237 Q814 240 820 239"/>
        <path d="M798 219 Q813 210 831 215 Q843 219 855 215"/>
        <path d="M824 196 Q839 187 854 191 Q865 195 875 191"/>
        <path d="M853 174 Q866 166 885 172 Q897 176 909 172"/>
        <path d="M879 151 Q889 145 902 146"/>
        <path d="M786 231 Q785 219 795 209"/>
        <path d="M815 204 Q815 191 825 181"/>
        <path d="M845 181 Q843 168 856 156"/>
      </g>
      <path d="M731 267 C750 262 762 254 774 241
               Q785 228 798 219 Q812 210 824 196
               Q838 182 853 174 Q866 164 879 151
               Q898 133 914 122"
            fill="none" stroke="#343434" stroke-width="2.8"/>
    </g>
    <path d="M815 207 L843 260 H873" fill="none" stroke="#888" stroke-width="1.1"/>
    <text x="881" y="267" font-size="18">棱线</text>
    <text x="826" y="310" text-anchor="middle" font-size="17" fill="#555">一层一层这样下来</text>

    <!-- 只取本段截止处之前已讲到的改道与中龙。 -->
    <path d="M46 455 H914" fill="none" stroke="#d6d6d2" stroke-width="1"/>
    <g font-size="20">
      <text x="148" y="501" fill="#555">1048年</text>
      <text x="271" y="501" font-weight="600">黄河改道</text>
      <path d="M382 494 H485 M477 488 L485 494 L477 500"
            fill="none" stroke="#686868" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="514" y="501" font-weight="600">中龙</text>
      <g fill="none" stroke-linecap="round">
        <path d="M574 494 H608 M629 494 H663" stroke="#555" stroke-width="2"/>
        <path d="M620 484 L613 503 M627 484 L620 503" stroke="#aa4034" stroke-width="2.2"/>
      </g>
      <text x="682" y="501">切断掉</text>
    </g>
  </g>
</svg>
