<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">大富星砂</title>
  <desc id="desc">侧视图以相近的两道弧线勾出水口砂宽圆的顶部和饱满的两肩，呈现倪师所说的大富星砂。下方以分支表示墓前面对这种砂时可当龙虎，也可当朝山，右侧引录倪师的断语。</desc>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#282828">
    <rect x="48" y="36" width="162" height="47" rx="3" fill="none" stroke="#444" stroke-width="1.4"/>
    <text x="129" y="68" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="2">大富星砂</text>

    <path d="M62 363 H134
             C158 363 168 354 176 332
             C190 286 205 229 248 184
             C299 131 372 103 466 103
             C558 103 638 128 692 178
             C738 221 760 276 779 328
             C788 352 800 363 826 363 H898
             V379 H62 Z" fill="#f3f3f1"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M62 363 H134
               C158 363 168 354 176 332
               C190 286 205 229 248 184
               C299 131 372 103 466 103
               C558 103 638 128 692 178
               C738 221 760 276 779 328
               C788 352 800 363 826 363 H898"
            stroke="#333" stroke-width="3"/>
      <path d="M185 332
               C200 282 215 233 255 191
               C307 137 379 109 466 108
               C500 108 533 111 563 118"
            stroke="#aaa" stroke-width="1.5"/>
    </g>

    <g text-anchor="middle">
      <text x="470" y="233" font-size="30" font-weight="600" letter-spacing="3">肥肥圆圆</text>
      <text x="470" y="271" font-size="21" fill="#555">很饱满</text>
    </g>
    <path d="M700 186 L745 141 H790" fill="none" stroke="#777" stroke-width="1.3" stroke-linejoin="round"/>
    <text x="802" y="148" font-size="21">水口砂</text>

    <g fill="none" stroke="#777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M206 455 H238 M238 455 V433 H270 M238 455 V477 H270"/>
    </g>
    <text x="88" y="463" font-size="22">墓前面对</text>
    <g font-size="21">
      <text x="283" y="441">龙虎</text>
      <text x="283" y="485">朝山</text>
    </g>
    <text x="857" y="463" text-anchor="end" font-size="23">“会发富发财”</text>
  </g>
</svg>
