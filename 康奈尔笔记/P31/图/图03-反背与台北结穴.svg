<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">反背与台北结穴</title>
  <desc id="desc">俯视台湾岛，中央山脉画成上宽下尖的半弯月形，倪师称这种山势为「反背」。顺着整条山势看，山带上端分成左右两弧，环抱的朱红空圈标出台北盆地，即他所说的结穴处。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 岛形上宽下尖，右上缘略有凹折。 -->
    <path d="M554 43
             C522 39 485 55 454 85
             C419 119 396 170 375 224
             C356 274 345 320 349 356
             C352 383 367 401 383 416
             C402 434 408 463 421 492
             Q425 502 429 489
             C436 459 437 420 445 381
             C456 329 466 287 482 242
             C499 196 528 158 562 127
             C578 113 588 99 587 88
             Q587 78 577 79
             Q569 81 572 68
             Q575 48 554 43Z"
          fill="#f7f7f5" stroke="#434343" stroke-width="2.2"/>

    <!-- 两侧山弧与下方的山带连成一体，弧间留出盆地。 -->
    <path d="M422 466
             C404 428 386 385 384 344
             C380 281 397 212 429 150
             C446 116 469 85 495 69
             C509 60 523 56 535 58
             C508 70 490 88 487 108
             C485 119 490 127 499 129
             C510 131 524 122 538 108
             C549 97 557 85 563 74
             C568 90 558 108 547 123
             C528 149 504 165 486 191
             C456 234 437 290 428 348
             C421 389 420 429 422 466Z"
          fill="#d5d5d1" stroke="#51514e" stroke-width="2"/>

    <!-- 少量顺势的笔线，让两侧山势在同一条山带上可循。 -->
    <g fill="none" stroke="#a3a39d" stroke-width="1.4">
      <path d="M410 399 C393 331 405 255 433 187 C445 157 461 131 474 116"/>
      <path d="M415 353 C424 283 448 211 480 166 C495 147 517 137 537 116"/>
    </g>

    <!-- 圈内留白，保留板书用圈指认整个盆地的画法。 -->
    <ellipse cx="525" cy="96" rx="21" ry="17" transform="rotate(-36 525 96)"
             fill="#fff" stroke="#ae4034" stroke-width="2.8"/>

    <g fill="none" stroke="#858581" stroke-width="1.3">
      <path d="M546 86 L605 58 H660"/>
      <path d="M476 93 L418 72 H308"/>
      <path d="M555 104 L607 157 H660"/>
      <path d="M366 267 L322 248 H280"/>
      <path d="M471 275 L550 278 H660"/>
      <path d="M414 369 L354 409 H280"/>
    </g>
  </g>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#292929">
    <rect x="48" y="37" width="117" height="44" rx="3" fill="#fff" stroke="#555" stroke-width="1.4"/>
    <text x="106.5" y="67" text-anchor="middle" font-size="23" font-weight="600">台湾岛</text>

    <g font-size="19">
      <text x="295" y="79" text-anchor="end">左边的山</text>
      <text x="674" y="164">右边的山</text>
      <text x="266" y="255" text-anchor="end">西岸这边比较窄</text>
      <text x="674" y="285">东岸这边山比较高</text>
    </g>

    <text x="674" y="66" font-size="25" font-weight="600">台北盆地</text>
    <text x="674" y="94" font-size="18">结穴</text>

    <text x="266" y="416" text-anchor="end" font-size="23" font-weight="600">中央山脉</text>
    <text x="266" y="445" text-anchor="end" font-size="18" fill="#555">半弯月形</text>
    <text x="266" y="471" text-anchor="end" font-size="18" fill="#555">反背</text>
  </g>
</svg>
