<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">天星四贵</title>
  <desc id="desc">以北京紫禁城为观察点，亥、艮、巽、兑各有一处峦头，四支箭头表示来龙向中央明堂汇聚。亥的山头上方单独标出倪师所说的「上应紫微」。</desc>

  <defs>
    <marker id="inward" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#626260" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#252525">
    <rect x="46" y="36" width="166" height="47" rx="3" fill="none" stroke="#454543" stroke-width="1.5"/>
    <text x="129" y="68" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="2">天星四贵</text>

    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- 亥的山头与正顶上方的文字共用一条垂线。 -->
      <text x="221" y="135" text-anchor="middle" font-size="20">上应紫微</text>
      <path d="M221 147 V192" fill="none" stroke="#92928f" stroke-width="1.4" stroke-dasharray="4 5"/>
      <text x="166" y="208" text-anchor="middle" font-size="24">亥</text>
      <path d="M112 279 Q137 270 155 250 Q166 236 178 239 Q188 241 199 223
               Q213 201 221 201 Q231 201 242 220 Q254 239 268 245 Q280 249 291 261 Q303 274 330 280"
            fill="#f1f1ef" stroke="#343432" stroke-width="2.3"/>
      <path d="M221 203 Q219 219 231 232 Q238 240 239 248 M178 240 Q184 247 180 255"
            fill="none" stroke="#989894" stroke-width="1.3"/>

      <text x="533" y="69" text-anchor="middle" font-size="24">艮</text>
      <path d="M430 153 Q454 145 472 127 Q483 114 494 117 Q505 116 518 94
               Q527 79 533 80 Q543 81 554 98 Q565 115 577 119 Q589 121 601 134 Q616 148 641 155"
            fill="#f1f1ef" stroke="#343432" stroke-width="2.3"/>
      <path d="M533 82 Q530 96 541 108 Q551 118 550 131 M494 118 Q500 125 498 133"
            fill="none" stroke="#989894" stroke-width="1.3"/>

      <text x="785" y="177" text-anchor="middle" font-size="24">巽</text>
      <path d="M683 257 Q705 250 722 234 Q738 215 749 218 Q760 221 771 201
               Q779 187 785 188 Q796 189 807 207 Q817 224 829 228 Q841 231 853 242 Q865 253 887 260"
            fill="#f1f1ef" stroke="#343432" stroke-width="2.3"/>
      <path d="M785 190 Q782 203 793 217 Q800 225 800 235 M749 219 Q755 225 753 232"
            fill="none" stroke="#989894" stroke-width="1.3"/>

      <path d="M566 453 Q588 448 606 431 Q617 419 629 420 Q640 420 651 400
               Q659 386 666 387 Q677 389 688 407 Q699 423 711 427 Q724 430 736 441 Q748 451 771 456"
            fill="#f1f1ef" stroke="#343432" stroke-width="2.3"/>
      <path d="M666 389 Q664 403 675 415 Q683 423 683 433 M629 421 Q635 427 632 435"
            fill="none" stroke="#989894" stroke-width="1.3"/>
      <text x="666" y="486" text-anchor="middle" font-size="24">兑</text>
    </g>

    <!-- 四支来龙各从一处峦头起，箭头停在中央观察点之外。 -->
    <g fill="none" stroke="#626260" stroke-width="1.8" stroke-linecap="round" marker-end="url(#inward)">
      <path d="M302 275 Q352 281 414 298"/>
      <path d="M530 157 Q526 202 507 252"/>
      <path d="M709 255 Q651 265 570 296"/>
      <path d="M641 405 Q606 371 563 341"/>
    </g>

    <g text-anchor="middle">
      <rect x="431" y="269" width="124" height="78" rx="3" fill="#fff" stroke="#494947" stroke-width="1.6"/>
      <text x="493" y="296" font-size="18">北京</text>
      <circle cx="455" cy="321" r="4.3" fill="#b43b30"/>
      <text x="501" y="329" font-size="22" font-weight="600">紫禁城</text>
      <text x="493" y="378" font-size="20">明堂</text>
    </g>
  </g>
</svg>
