<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">破军跟禄存</title>
  <desc id="desc">并排对照黑板上的两幅山形。左图破军星的大拱内，两道小拱在底线上相接。右图禄存星的大拱内，一条曲线两边隆起，中间圆缓下凹，形似笔架。</desc>
  <rect width="960" height="540" fill="#fff"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" fill="#282828">
    <g font-size="28" font-weight="600">
      <text x="252" y="107">破军星</text>
      <text x="708" y="107">禄存星</text>
    </g>

    <g fill="none" stroke="#848480" stroke-width="2" stroke-linejoin="round">
      <path d="M70 348 C79 248 156 155 248 155 C346 155 419 245 434 348 Z"/>
      <path d="M526 348 C535 248 612 155 704 155 C802 155 875 245 890 348 Z"/>
    </g>

    <g fill="#f1f1ef">
      <path d="M70 348 C82 297 122 243 166 243 C211 243 242 296 252 348 C258 291 298 220 344 220 C389 220 424 291 434 348 Z"/>
      <path d="M526 348 C541 294 567 233 611 233 C658 233 667 310 708 310 C750 310 757 230 804 230 C848 230 875 295 890 348 Z"/>
    </g>
    <g fill="none" stroke="#30302e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 348 C82 297 122 243 166 243 C211 243 242 296 252 348 C258 291 298 220 344 220 C389 220 424 291 434 348"/>
      <path d="M526 348 C541 294 567 233 611 233 C658 233 667 310 708 310 C750 310 757 230 804 230 C848 230 875 295 890 348"/>
    </g>
    <path d="M70 348 H434 M526 348 H890" fill="none" stroke="#848480" stroke-width="1.5"/>

    <g fill="none" stroke="#777773" stroke-width="1.3" stroke-linecap="round">
      <path d="M252 356 V397"/>
      <path d="M708 318 V397"/>
    </g>
    <g font-size="22">
      <text x="252" y="431">要连在一起的</text>
      <text x="708" y="431">中间凹下去的</text>
    </g>
  </g>
</svg>
