<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">圆山饭店选址</title>
  <desc id="desc">台北盆地的平地上隆起一座圆肥的山头，倪师称其为富星砂。从圆山饭店顺箭头看去，弯过的马路作明堂，对面的山头作案山；饭店下方露出一段河，两端渐隐，表示在饭店看不到水来水去。</desc>

  <defs>
    <marker id="facing" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#a34032" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="riverFade" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".22" stop-color="#fff"/>
      <stop offset=".78" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="riverWindow" maskUnits="userSpaceOnUse" x="366" y="368" width="484" height="76">
      <rect x="366" y="368" width="484" height="76" fill="url(#riverFade)"/>
    </mask>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#292929">
    <ellipse cx="474" cy="282" rx="412" ry="175" fill="#fafaf8" stroke="#c7c7c2" stroke-width="1.4"/>

    <text x="78" y="91" font-size="22">台北市的盆地</text>
    <path d="M150 104 V127 L185 157" fill="none" stroke="#92928c" stroke-width="1.2"/>

    <!-- 平地上的单一山头。宽缓的山脚与平地相接。 -->
    <path d="M179 239
             C206 238 219 227 231 207
             C249 176 270 149 309 144
             C349 138 378 157 400 185
             C420 211 430 230 469 236
             C425 247 376 251 323 251
             C265 251 218 247 179 239Z"
          fill="#e8e8e3"/>
    <path d="M163 240 C196 240 216 233 231 207
             C249 176 270 149 309 144
             C349 138 378 157 400 185
             C420 211 430 230 469 236 L486 236"
          fill="none" stroke="#393936" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M209 241 Q316 261 437 241" fill="none" stroke="#bdbdb6" stroke-width="1.1"/>
    <text x="318" y="211" text-anchor="middle" font-size="24" font-weight="600">富星砂</text>

    <text x="303" y="72" text-anchor="middle" font-size="22">平地一凸</text>
    <path d="M303 84 V112 L315 137" fill="none" stroke="#777771" stroke-width="1.2"/>
    <text x="466" y="170" font-size="21">案山</text>
    <path d="M457 175 H441 L413 195" fill="none" stroke="#777771" stroke-width="1.2"/>

    <!-- 马路弯过饭店与山头之间。 -->
    <path d="M139 255 C191 312 243 346 323 342
             C406 338 463 286 542 262
             C613 240 675 233 738 239
             L738 250
             C675 244 615 251 546 273
             C467 298 411 350 324 354
             C241 358 184 323 134 263Z"
          fill="#e4e4e0"/>
    <g fill="none" stroke-linecap="round">
      <path d="M139 255 C191 312 243 346 323 342 C406 338 463 286 542 262 C613 240 675 233 738 239
               M134 263 C184 323 241 358 324 354 C411 350 467 298 546 273 C615 251 675 244 738 250"
            stroke="#70706b" stroke-width="1.5"/>
      <path d="M137 259 C188 317 242 352 323 348 C409 344 465 292 544 267 C614 246 675 239 738 245"
            stroke="#aaa9a3" stroke-width="1" stroke-dasharray="8 8"/>
    </g>
    <text x="191" y="364" font-size="19">马路</text>
    <path d="M213 344 L224 333" fill="none" stroke="#777771" stroke-width="1.2"/>
    <text x="424" y="358" font-size="21" font-weight="600">明堂</text>
    <path d="M447 337 V327 L434 315" fill="none" stroke="#777771" stroke-width="1.2"/>

    <!-- 箭尾靠饭店，箭头越过马路，朝向同一座山。 -->
    <path d="M605 316 L426 229" fill="none" stroke="#a34032" stroke-width="2.3" stroke-linecap="round" marker-end="url(#facing)"/>
    <text x="542" y="312" font-size="18" fill="#903b30">朝向</text>

    <!-- 用低而宽的体块表示口述建议。 -->
    <path d="M569 360 C600 359 614 349 634 347 C668 340 728 342 750 350 C770 357 792 362 816 362"
          fill="none" stroke="#999992" stroke-width="1.3" stroke-linecap="round"/>
    <g stroke="#444440" stroke-width="1.8" stroke-linejoin="round">
      <path d="M612 317 L708 294 L753 314 L656 339Z" fill="#f0f0ec"/>
      <path d="M612 317 L656 339 V353 L612 331Z" fill="#e4e4df"/>
      <path d="M656 339 L753 314 V328 L656 353Z" fill="#fafaf7"/>
    </g>
    <text x="763" y="271" text-anchor="middle" font-size="23" font-weight="600">圆山饭店</text>
    <path d="M762 282 V293 L741 306" fill="none" stroke="#777771" stroke-width="1.2"/>
    <text x="731" y="384" text-anchor="middle" font-size="17">盖低一点平面大一点嘛</text>

    <!-- 只显出饭店下方的一段河，不标来去方向。 -->
    <g mask="url(#riverWindow)">
      <path d="M367 378 C447 377 460 414 542 411 C627 408 646 389 712 390 C772 390 805 404 850 400
               L850 415 C802 420 771 405 712 405 C647 405 628 425 543 428 C457 431 442 392 367 395Z"
            fill="#e5e6e4"/>
      <path d="M367 378 C447 377 460 414 542 411 C627 408 646 389 712 390 C772 390 805 404 850 400
               M367 395 C442 392 457 431 543 428 C628 425 647 405 712 405 C771 405 802 420 850 415"
            fill="none" stroke="#858782" stroke-width="1.4"/>
    </g>
    <path d="M573 433 L562 458 H489" fill="none" stroke="#777771" stroke-width="1.2"/>
    <g text-anchor="middle">
      <text x="465" y="465" font-size="20" font-weight="600" stroke="#fff" stroke-width="6" paint-order="stroke">来水</text>
      <text x="465" y="495" font-size="18">看不到水来看不到水去</text>
    </g>
  </g>
</svg>
