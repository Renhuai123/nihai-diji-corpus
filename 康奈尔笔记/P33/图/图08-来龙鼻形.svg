               C483 417 502 413 524 405
               C550 396 568 402 592 414
               C615 426 635 426 658 419
               C686 409 706 416 729 430
               C766 452 809 467 881 476"
            fill="none" stroke="#393939" stroke-width="2.2"/>
      <g fill="none" stroke="#888" stroke-width="1.1">
        <path d="M573 374 L549 399"/>
        <path d="M851 473 L827 496 H800"/>
      </g>
      <circle cx="851" cy="471.5" r="4.8" fill="#b43b30" stroke="#fff" stroke-width="1.2"/>
    </g>
    <g font-size="18">
      <text x="184" y="505" text-anchor="middle">前面结穴</text>
      <text x="580" y="378">软弱无力</text>
      <text x="788" y="503" text-anchor="end">在后面</text>
    </g>
  </g>
</svg>
