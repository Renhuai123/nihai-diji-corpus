<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">官帽与玉带</title>
  <desc id="desc">左图取纱帽山的侧影，上窄下宽的两层凸起坐在一道长弧上。右图以等宽薄带绕圈内卷，底部合看官与带，对应倪师所说的「一方之主」。</desc>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#262626">
    <g font-size="25" font-weight="600" text-anchor="middle">
      <text x="260" y="79">纱帽山</text>
      <text x="702" y="79">玉带</text>
    </g>

    <g stroke="#343434" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M204 171
               C208 152 214 132 227 126
               C239 121 278 121 291 126
               C305 132 312 151 317 171
               Q261 160 204 171Z" fill="#efefed"/>
      <path d="M148 237
               C151 212 157 185 170 178
               C184 170 216 164 259 164
               C303 164 334 169 349 178
               C363 186 369 212 372 237
               Q260 213 148 237Z" fill="#f5f5f3"/>
      <path d="M61 264
               C126 239 190 225 259 225
               C329 225 396 239 459 262" fill="none"/>
    </g>

    <g fill="none" stroke-linecap="butt" stroke-linejoin="round">
      <path id="belt" d="M548 180
                         C591 154 651 126 712 126
                         C773 126 830 157 841 207
                         C852 254 808 268 741 268
                         C681 268 626 264 619 232
                         C612 202 641 181 680 179
                         C720 177 754 189 757 208
                         C759 219 751 229 738 237"
            stroke="#343434" stroke-width="14"/>
      <use href="#belt" stroke="#e8e8e5" stroke-width="10" style="stroke:inherit;stroke-width:inherit" visibility="hidden"/>
      <path d="M548 180
               C591 154 651 126 712 126
               C773 126 830 157 841 207
               C852 254 808 268 741 268
               C681 268 626 264 619 232
               C612 202 641 181 680 179
               C720 177 754 189 757 208
               C759 219 751 229 738 237" stroke="#e8e8e5" stroke-width="10"/>
      <path d="M544.5 174.2 L551.5 185.8 M734.4 231.2 L741.6 242.8" stroke="#343434" stroke-width="2"/>
    </g>

    <g font-size="22" text-anchor="middle">
      <text x="203" y="322">形如帽</text>
      <text x="324" y="322" font-weight="600">出官</text>
      <text x="702" y="322">上下都一样的距离</text>
    </g>
    <path d="M250 314 H283 M276 308 L283 314 L276 320" fill="none" stroke="#666" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M64 368 H896" fill="none" stroke="#d4d4d0" stroke-width="1.2"/>

    <g fill="none" stroke="#555" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="294" cy="441" r="29" stroke-width="1.6"/>
      <circle cx="408" cy="441" r="29" stroke-width="1.6"/>
      <path d="M343 441 H359 M351 433 V449" stroke-width="1.6"/>
      <path d="M461 441 H515 M506 434 L515 441 L506 448" stroke-width="1.8"/>
    </g>
    <g font-size="25" text-anchor="middle">
      <text x="294" y="450">官</text>
      <text x="408" y="450">带</text>
    </g>
    <text x="541" y="452" font-size="30" font-weight="600" letter-spacing="2">一方之主</text>
  </g>
</svg>
