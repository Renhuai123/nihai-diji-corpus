<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">关渡两边的水口砂</title>
  <desc id="desc">俯视示意。沿倪师所讲的水路，从新店溪出来的淡水河与另一边的基隆河会在关渡，再从狮子、绣球两处水口砂之间流出入海。倪师看来水，首先看水是否清澈。</desc>

  <defs>
    <path id="rivers" d="M266 463
      C270 427 298 414 327 398
      C361 380 386 366 396 336
      C409 299 417 276 451 248
      M738 389
      C708 373 698 347 662 341
      C620 334 597 346 559 326
      C511 301 506 265 451 248
      M451 248
      C468 221 473 205 463 182
      C449 151 440 138 452 112
      C460 93 485 80 498 54"/>
    <path id="tip" d="M-5 3 L0 -4 L5 3" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#292929">
