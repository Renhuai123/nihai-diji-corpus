    <use href="#tip" transform="translate(366 373) rotate(46)"/>
    <use href="#tip" transform="translate(578 334) rotate(-68)"/>
    <use href="#tip" transform="translate(457 116) rotate(25)"/>
    <use href="#tip" transform="translate(498 54) rotate(27)"/>

    <g fill="#fff" stroke="#42433f" stroke-width="2">
