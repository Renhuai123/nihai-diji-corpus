<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">文化学院与龙眼</title>
  <desc id="desc">侧面示意图。山头在左，后方的山脊向右绵延。按倪师的比喻，文化学院正盖在山头的龙眼上，校舍底边遮住眼形的上半部。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#292929">
    <rect x="48" y="38" width="250" height="48" rx="3" fill="none" stroke="#444" stroke-width="1.4"/>
    <text x="173" y="70" text-anchor="middle" font-size="24" font-weight="600">盖在龙的眼睛上面</text>

    <path d="M48 387
             C80 382 99 362 119 337
             C143 307 158 279 183 265
             C202 254 222 251 244 251
             H296
             C342 251 368 268 411 269
             C462 271 493 250 533 240
             C582 228 619 233 659 226
             C712 217 741 196 788 192
             C832 189 872 193 912 185
             V436 H48 Z" fill="#f3f3f1"/>
    <path d="M48 387
             C80 382 99 362 119 337
             C143 307 158 279 183 265
             C202 254 222 251 244 251
             H296
             C342 251 368 268 411 269
             C462 271 493 250 533 240
             C582 228 619 233 659 226
             C712 217 741 196 788 192
             C832 189 872 193 912 185"
          fill="none" stroke="#383838" stroke-width="2.4" stroke-linecap="round"/>

    <!-- 眼形与校舍共用一个中心，校舍底边叠在眼形上。 -->
    <path d="M244 254 Q266 231 288 254 Q266 277 244 254 Z"
          fill="#fff" stroke="#464646" stroke-width="1.8"/>
    <circle cx="266" cy="254" r="5.5" fill="#af4035"/>

    <g stroke="#383838" stroke-linejoin="round">
      <path d="M225 211 H307 V254 H225 Z" fill="#fafaf9" stroke-width="2"/>
      <path d="M221 205 H311 V212 H221 Z" fill="#eee" stroke-width="1.8"/>
      <g fill="#dededb" stroke-width="1.2">
        <rect x="236" y="222" width="12" height="13"/>
        <rect x="260" y="222" width="12" height="13"/>
        <rect x="284" y="222" width="12" height="13"/>
      </g>
      <path d="M221 249 H311 V254 H221 Z" fill="#e6e6e3" stroke-width="1.6"/>
    </g>

    <g fill="none" stroke="#777" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M266 172 V198"/>
      <path d="M125 271 H151 L178 262"/>
      <path d="M272 267 L304 306 H336"/>
    </g>

    <text x="266" y="160" text-anchor="middle" font-size="23" font-weight="600">文化学院</text>
    <text x="114" y="277" text-anchor="end" font-size="19">山头</text>
    <text x="347" y="312" font-size="21">龙眼</text>
    <text x="650" y="189" text-anchor="middle" font-size="21">后面的龙很长</text>
  </g>
</svg>
