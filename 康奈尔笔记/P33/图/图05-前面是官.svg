<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">前面是官，山后是鬼</title>
  <desc id="desc">俯视示意。山的前面标为「官」。沿山形向后看，多条脉从山后向两旁伸出，引线将这个部位标为「鬼」。</desc>
  <rect width="960" height="540" fill="#fff"/>

  <!-- 两侧轮廓向内回弯，内缘有两个低弯，中间拱起。 -->
  <path d="M387 124
           C344 143 322 182 327 221
           C332 258 361 284 408 300
           C432 308 450 320 465 338
           Q474 349 484 338
           C501 318 524 308 550 298
           C593 281 622 251 626 213
           C630 176 609 143 567 124
           C589 154 596 186 584 211
           C575 230 561 241 545 239
           C520 237 513 207 496 190
           C484 177 471 175 459 188
           C439 209 433 240 408 245
           C392 248 377 239 368 222
           C352 191 363 151 387 124Z"
        fill="#f1f1ee" stroke="#343434" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 山后的脉与山体相接，右侧三条分别向右上、右方、右下伸出。 -->
  <g fill="none" stroke="#414141" stroke-width="2.6" stroke-linecap="round">
    <path d="M428 308 C391 302 356 299 320 288 C278 275 246 248 200 244"/>
    <path d="M452 325 C409 311 374 315 329 325 C276 337 227 339 170 328"/>
    <path d="M466 339 C430 325 398 333 361 353 C320 376 281 400 233 407"/>
    <path d="M531 306 C573 306 619 290 657 266 C697 241 716 211 743 187"/>
    <path d="M506 318 C551 308 591 321 641 326 C691 331 735 327 787 313"/>
    <path d="M484 338 C514 319 554 334 594 357 C637 381 677 403 726 415"/>
  </g>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" fill="#292929">
    <text x="478" y="58" font-size="18" fill="#606060">前面</text>
    <text x="478" y="102" font-size="34" font-weight="600">官</text>

    <text x="477" y="278" font-size="23">山</text>

    <path d="M743 280 H720 L694 325" fill="none" stroke="#858585" stroke-width="1.3" stroke-linejoin="round"/>
    <text x="761" y="286" font-size="20">脉</text>

    <path d="M475 350 V395" fill="none" stroke="#858585" stroke-width="1.3"/>
    <text x="475" y="425" font-size="18" fill="#606060">山的后面</text>
    <text x="475" y="472" font-size="36" font-weight="600" fill="#a23c31">鬼</text>
  </g>
</svg>
