<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">骑龙葬与金城骨</title>
  <desc id="desc">左图俯看城局，水从环山之间流出，朱红线沿山脉标出倪师所说可葬的一整排。右图正面画出眉毛上方的两根通天骨，倪师称为金城骨。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#282828">
    <g fill="none" stroke="#4b4b49" stroke-width="1.4">
      <rect x="46" y="36" width="144" height="47" rx="3"/>
      <rect x="603" y="36" width="144" height="47" rx="3"/>
    </g>
    <g text-anchor="middle" font-size="24" font-weight="600" letter-spacing="2">
      <text x="118" y="68">骑龙葬</text>
      <text x="675" y="68">金城骨</text>
    </g>

