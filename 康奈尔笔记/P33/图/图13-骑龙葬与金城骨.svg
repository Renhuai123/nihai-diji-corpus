    <text x="323" y="241" font-size="23" font-weight="500">城局</text>
    <text x="461" y="411" font-size="19">水</text>
    <path d="M472 388 L475 371" fill="none" stroke="#90908c" stroke-width="1.2"/>

    <g fill="none" stroke="#7e7e79" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M228 248 L179 309 H127" stroke="#fff" stroke-width="4"/>
      <path d="M228 248 L179 309 H127"/>
