<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">内砂和外砂</title>
  <desc id="desc">俯视图。两侧弧线环抱明堂，聚水之中标出内砂，两支箭头示意水从两边向外流。门口两处砂用同一标注指出，都是水口砂，也就是外砂。</desc>
  <defs>
    <marker id="flow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 2 L9 6 L2 10" fill="none" stroke="#626968" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#292929">
    <rect x="46" y="36" width="218" height="49" rx="3" fill="none" stroke="#484848" stroke-width="1.5"/>
    <text x="155" y="69" text-anchor="middle" font-size="24" font-weight="600">内砂比外砂好</text>

    <!-- 两翼向门口收拢，下端相接，再延为一道弯脊。 -->
    <path d="M429 505
             C473 482 461 458 423 446
             C345 422 280 374 262 309
             C247 255 263 207 298 178
             C308 170 316 167 322 168
             C326 173 319 183 310 196
             C288 230 289 269 306 305
             C332 359 401 395 466 399
             C537 403 613 371 649 320
             C677 280 682 236 660 197
             C653 184 643 174 648 168
             C653 164 668 174 677 182
             C712 214 722 266 705 316
             C682 384 608 429 527 444
             C493 450 483 461 488 475
             C492 488 488 499 478 505"
          fill="#f3f3f0" stroke="#444643" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="none" stroke="#b7b8b2" stroke-width="1.3" stroke-linecap="round">
      <path d="M286 201 C253 259 273 325 322 367 C361 400 405 417 447 427"/>
      <path d="M685 209 C711 266 687 331 638 370 C599 401 551 420 507 428"/>
    </g>

    <!-- 池面向两侧水口自然收窄。 -->
    <path d="M304 148
             C322 169 349 181 371 194
             C408 214 443 216 479 216
             C523 216 559 208 594 187
             C615 174 636 158 650 143
             C643 169 621 194 607 215
             C589 241 615 249 621 276
             C631 326 560 369 477 369
             C397 369 338 334 339 292
             C340 261 371 245 361 225
             C350 203 315 183 304 148Z"
          fill="#eff2f1"/>
    <g fill="none" stroke="#b1b9b6" stroke-width="1.4" stroke-linecap="round">
      <path d="M368 283 Q383 278 399 282 M376 290 Q386 288 394 289"/>
      <path d="M522 337 Q539 332 557 335 M532 343 Q541 341 549 342"/>
      <path d="M538 240 Q548 237 560 239"/>
    </g>

    <!-- 两处门口用同一组引线标出，箭头另画在各自的水路上。 -->
    <g fill="none" stroke="#626968" stroke-width="1.8" stroke-linecap="round" marker-end="url(#flow)">
      <path d="M400 232 C389 211 365 201 342 183 C328 172 315 160 305 145"/>
      <path d="M564 227 C580 206 606 194 628 172 C638 162 646 151 653 139"/>
    </g>
    <g fill="#e5e5e0" stroke="#494b47" stroke-width="2" stroke-linejoin="round">
      <path d="M349 155 C350 147 358 140 368 140 C378 140 387 147 388 155 C388 162 380 167 369 167 C359 167 350 163 349 155Z"/>
      <path d="M574 153 C577 145 586 139 596 140 C606 140 613 147 613 155 C612 163 602 167 592 166 C582 166 574 161 574 153Z"/>
    </g>
    <g fill="none" stroke="#787b75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M433 100 H408 L372 135"/>
      <path d="M528 100 H551 L592 135"/>
    </g>
    <text x="480" y="107" text-anchor="middle" font-size="22">水口砂</text>

    <!-- 内砂单独点朱，四周留出连续的水面。 -->
    <path d="M431 294 C431 282 444 271 459 269 C474 267 489 275 492 287
             C495 299 482 308 467 310 C451 312 433 307 431 294Z"
          fill="#f6eeea" stroke="#5a504a" stroke-width="2"/>
    <circle cx="462" cy="289" r="4.5" fill="#ae4134"/>
    <path d="M496 289 H513" fill="none" stroke="#73756f" stroke-width="1.2"/>
    <text x="522" y="296" font-size="22" font-weight="600">内砂</text>
    <text x="480" y="254" text-anchor="middle" font-size="20" fill="#515855" letter-spacing="3">明堂</text>
  </g>
</svg>
