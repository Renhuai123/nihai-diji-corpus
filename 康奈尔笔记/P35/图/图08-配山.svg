<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">配山</title>
  <desc id="desc">两行连线分别表示子配虚日鼠、丑配牛金牛。细字保留讲到子时接着念的“危日燕”“日为君火”，以及讲到牛金牛时说的“天上的牛”。</desc>
  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#262626">
    <rect x="68" y="49" width="104" height="46" rx="3" fill="none" stroke="#454545" stroke-width="1.5"/>
    <text x="120" y="80" text-anchor="middle" font-size="24" font-weight="600">配山</text>
    <text x="199" y="81" font-size="29" font-weight="600">28宿配24个山</text>

    <g fill="#f5f5f3" stroke="#555" stroke-width="1.5">
      <rect x="154" y="167" width="88" height="72" rx="3"/>
      <rect x="154" y="339" width="88" height="72" rx="3"/>
    </g>
    <g text-anchor="middle" font-size="36" font-weight="500">
      <text x="198" y="216">子</text>
      <text x="198" y="388">丑</text>
    </g>

    <g fill="none" stroke="#575757" stroke-width="1.8">
      <path d="M242 203 H477"/>
      <path d="M242 375 H477"/>
    </g>
    <g fill="#575757">
      <circle cx="477" cy="203" r="3.5"/>
      <circle cx="477" cy="375" r="3.5"/>
    </g>

    <g font-size="36" font-weight="500">
      <text x="500" y="216">虚日鼠</text>
      <text x="500" y="388">牛金牛</text>
    </g>
    <g font-size="21" fill="#595959">
      <text x="501" y="261">危日燕</text>
      <text x="596" y="261">日为君火</text>
      <text x="501" y="433">天上的牛</text>
    </g>
  </g>
</svg>
