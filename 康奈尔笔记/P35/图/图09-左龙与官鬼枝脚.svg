<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">左龙与官鬼枝脚</title>
  <desc id="desc">左龙一弯较宽、绕得较深，向上折回后与右边较小的虎弯相连。左龙前段画出向外伸展的官鬼枝脚，示意课中所说的枝脚伸出去越多，长房发的越强。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#282828">
    <rect x="50" y="36" width="150" height="47" rx="3" fill="none" stroke="#484848" stroke-width="1.5"/>
    <text x="125" y="68" text-anchor="middle" font-size="24" font-weight="600" letter-spacing="2">龙比虎大</text>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 两弯相连，左宽而深，右窄而浅。 -->
      <path d="M337 162
               C297 195 279 248 290 294
               C303 349 347 384 396 383
               C442 382 472 353 470 314
               C469 282 445 258 445 230
               C445 209 456 195 473 195
               C504 195 528 230 535 264
               C541 292 533 316 555 324
               C576 332 600 312 603 286
               C610 241 578 199 540 172"
            stroke="#343434" stroke-width="3.2"/>

      <!-- 外侧长弧，左弧前段分出错落的枝脚。 -->
      <path d="M291 410
               C254 371 233 316 238 263
               C241 239 246 215 254 195
               C261 177 271 159 283 143
               C294 128 307 114 321 102"
            stroke="#343434" stroke-width="3.2"/>
      <path d="M540 172 C601 185 650 233 668 285 C680 320 680 350 673 374"
            stroke="#505050" stroke-width="2.6"/>

      <g stroke="#343434" stroke-width="2.6">
        <path d="M283 143 Q294 122 297 99"/>
        <path d="M268 166 Q289 151 310 126"/>
        <path d="M254 195 Q275 174 305 154"/>
        <path d="M243 231 Q256 209 284 189"/>
      </g>
    </g>

    <g fill="none" stroke="#878787" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M166 159 H207 L291 113"/>
      <path d="M187 330 H242 L294 307"/>
      <path d="M715 278 H657 L606 269"/>
    </g>
    <text x="154" y="166" text-anchor="end" font-size="22">官鬼枝脚</text>
    <text x="175" y="337" text-anchor="end" font-size="23">左龙</text>
    <text x="175" y="365" text-anchor="end" font-size="19" fill="#555">长房</text>
    <text x="727" y="286" font-size="23">虎</text>

    <g font-size="25" font-weight="600">
      <text x="405" y="479" text-anchor="end">伸出去越多</text>
      <path d="M432 470 H505 M496 463 L505 470 L496 477" fill="none" stroke="#505050" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="532" y="479">长房发的越强</text>
    </g>
  </g>
</svg>
