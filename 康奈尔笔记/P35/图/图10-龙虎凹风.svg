<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">龙虎凹风</title>
  <desc id="desc">两幅俯视图并排。左图的左龙长、右虎短，风从右边进入左龙的内弯；右图的龙短、白虎长，风从左下斜向右上，进入白虎的内弯。</desc>

  <defs>
    <g id="ridges" stroke-linecap="round" stroke-linejoin="round">
      <path d="M210 424
               C154 396 98 350 76 286
               C53 220 67 165 111 133
               C146 107 203 98 245 118
               Q250 121 244 123
               C193 134 153 159 133 195
               C111 235 115 276 139 309
               C160 338 193 357 221 358
               C244 359 263 349 273 333
               C283 316 281 297 268 282
               Q265 278 271 279
               C296 284 313 303 316 325
               C320 353 306 375 282 391
               C256 407 236 417 224 430"
            fill="#f1f1ef" stroke="#383838" stroke-width="2.4"/>
      <path d="M209 399 C155 367 110 322 96 270
               C80 208 100 159 151 134"
            fill="none" stroke="#b7b7b2" stroke-width="1.3"/>
      <path d="M251 390 C277 378 298 356 300 334"
            fill="none" stroke="#b7b7b2" stroke-width="1.3"/>
    </g>
    <marker id="wind" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 L10 6 L2 10.5" fill="none" stroke="#393939"
            stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#262626">
    <g font-size="25" font-weight="600" text-anchor="middle">
      <text x="240" y="66">龙边就会有凹风</text>
      <text x="720" y="66">白虎这个地方有凹</text>
    </g>

    <use href="#ridges"/>
    <use href="#ridges" transform="translate(960 0) scale(-1 1)"/>

    <g fill="none" stroke="#393939" stroke-width="2.4" stroke-linecap="round" marker-end="url(#wind)">
      <path d="M396 208 C324 204 230 226 141 223"/>
      <path d="M566 298 C625 255 716 212 815 207"/>
    </g>

    <g fill="none" stroke="#858581" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M253 121 H273"/>
      <path d="M317 318 L338 343 H353"/>
      <path d="M707 121 H687"/>
      <path d="M643 318 L622 343 H607"/>
    </g>
    <g font-size="19">
      <text x="282" y="128">左龙凸出去</text>
      <text x="361" y="350">右虎</text>
      <text x="678" y="128" text-anchor="end">白虎</text>
      <text x="599" y="350" text-anchor="end">龙这样很小</text>
    </g>

    <text x="480" y="492" text-anchor="middle" font-size="22" font-weight="500">要有风在动</text>
  </g>
</svg>
