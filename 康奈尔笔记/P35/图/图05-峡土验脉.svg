               C475 280 493 298 520 311
               C550 326 582 337 586 359
               C591 386 557 407 518 418
               C473 431 411 428 365 416
               C325 405 291 385 311 356Z"/>
    </g>

    <g fill="none" stroke="#b3b3ad" stroke-width="1.25">
      <path d="M348 121 C361 93 400 74 439 72 C483 69 525 86 543 112
               C557 132 534 143 509 151 C485 159 466 176 447 178
               C426 179 406 165 384 157 C359 148 338 140 348 121Z"/>
      <path d="M347 359 C365 342 392 337 415 324 C432 314 443 309 457 310
               C476 311 493 326 518 337 C543 348 557 359 549 373
               C535 393 485 404 443 401 C395 399 327 384 347 359Z"/>
    </g>

    <g font-size="20" text-anchor="middle">
      <text x="446" y="128">山头</text>
      <text x="448" y="367">山头</text>
    </g>
    <g fill="none" stroke="#545454" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M451 190 V229"/>
      <path d="M451 301 V265"/>
    </g>

    <text x="146" y="255" font-size="24">来龙</text>
    <path d="M393 216 H410 L438 246" fill="none" stroke="#666" stroke-width="1.3"/>
    <text x="383" y="222" text-anchor="end" font-size="22">峡</text>
    <circle cx="441" cy="248" r="3.5" fill="#484848"/>

    <path d="M763 237 L787 215 H802" fill="none" stroke="#666" stroke-width="1.3"/>
    <circle cx="760" cy="240" r="6" fill="#af3c30" stroke="#fff" stroke-width="1.6"/>
    <text x="810" y="221" font-size="21">穴位</text>

    <g text-anchor="middle">
      <text x="340" y="496" font-size="25">峡土的颜色</text>
      <text x="480" y="494" font-size="19" fill="#60605c">相等于</text>
